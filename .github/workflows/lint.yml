name: Lint

on:
  pull_request:
  push:

jobs:
  repository-constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test repository constraint checks
        run: python3 -m unittest discover -s scripts/lint -p 'test_*.py'
      - name: Check repository constraints
        run: python3 scripts/lint/check_function_spacing.py
