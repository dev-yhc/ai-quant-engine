services:
  temporal-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - temporal-postgresql-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "nc -z \"$$(hostname -i)\" 7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.26.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

  valuation-engine:
    image: quant-engine-valuation-engine:local
    build:
      context: .
      dockerfile: apps/valuation-engine/Dockerfile
    env_file:
      - ./apps/data_collector/.env
    environment:
      VALUATION_ENGINE_GRPC_ADDR: :9090
    ports:
      - "9090:9090"

  data-collector:
    image: quant-engine-data-collector:local
    build:
      context: .
      dockerfile: apps/data_collector/Dockerfile
    depends_on:
      temporal:
        condition: service_healthy
      valuation-engine:
        condition: service_started
    env_file:
      - ./apps/data_collector/.env
    environment:
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: data-collector
      VALUATION_ENGINE_GRPC_ADDR: valuation-engine:9090
    restart: unless-stopped

  data-collector-schedule:
    image: quant-engine-data-collector:local
    build:
      context: .
      dockerfile: apps/data_collector/Dockerfile
    depends_on:
      temporal:
        condition: service_healthy
      valuation-engine:
        condition: service_started
    env_file:
      - ./apps/data_collector/.env
    environment:
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: data-collector
      VALUATION_ENGINE_GRPC_ADDR: valuation-engine:9090
    entrypoint: ["/usr/local/bin/schedule-data-collector"]
    profiles: ["tools"]

  alert-dispatcher:
    image: quant-engine-alert-dispatcher:local
    build:
      context: .
      dockerfile: apps/alert-dispatcher/Dockerfile
    env_file:
      - ./apps/data_collector/.env
    profiles: ["alerts"]

volumes:
  temporal-postgresql-data:
